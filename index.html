<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D T-Shirt Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 100;
            max-width: 320px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 10px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #e0e0e0;
            border-color: #667eea;
            color: #667eea;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .preview-container {
            margin-top: 15px;
            text-align: center;
        }

        #preview-image {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .slider-group {
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        .slider-value {
            display: inline-block;
            float: right;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="controls">
        <h1>🎨 3D T-Shirt Designer</h1>
        
        <div class="control-group">
            <label>Upload Desain Anda:</label>
            <input type="file" id="texture-upload" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('texture-upload').click()">
                📁 Pilih Gambar
            </button>
            <div class="preview-container">
                <img id="preview-image" alt="Preview">
            </div>
        </div>

        <div class="control-group">
            <label>Warna Baju:</label>
            <input type="color" id="shirt-color" value="#ffffff">
        </div>

        <div class="slider-group">
            <label>
                Ukuran Desain: 
                <span class="slider-value" id="scale-value">1.0</span>
            </label>
            <input type="range" id="design-scale" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="slider-group">
            <label>
                Posisi Vertikal: 
                <span class="slider-value" id="position-value">0</span>
            </label>
            <input type="range" id="design-position" min="-0.5" max="0.5" step="0.05" value="0">
        </div>

        <div class="btn-group">
            <button class="action-btn" onclick="resetDesign()">🔄 Reset</button>
            <button class="action-btn" onclick="downloadScreenshot()">📸 Screenshot</button>
        </div>
    </div>

    <div class="info">
        💡 Drag untuk memutar | Scroll untuk zoom
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let tshirt, designTexture;
        let currentDesignMesh;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 10;
            controls.maxPolarAngle = Math.PI / 1.5;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(-5, 3, -5);
            scene.add(pointLight);

            createTShirt();

            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function createTShirt() {
            const tshirtGroup = new THREE.Group();

            const bodyGeometry = new THREE.BoxGeometry(2, 2.5, 0.3);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.7,
                metalness: 0.1
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            tshirtGroup.add(body);

            const sleeveGeometry = new THREE.CylinderGeometry(0.25, 0.3, 0.8, 16);
            const sleeveMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.7,
                metalness: 0.1
            });

            const leftSleeve = new THREE.Mesh(sleeveGeometry, sleeveMaterial);
            leftSleeve.rotation.z = Math.PI / 2;
            leftSleeve.position.set(-1.4, 0.7, 0);
            leftSleeve.castShadow = true;
            tshirtGroup.add(leftSleeve);

            const rightSleeve = new THREE.Mesh(sleeveGeometry, sleeveMaterial);
            rightSleeve.rotation.z = Math.PI / 2;
            rightSleeve.position.set(1.4, 0.7, 0);
            rightSleeve.castShadow = true;
            tshirtGroup.add(rightSleeve);

            const collarGeometry = new THREE.CylinderGeometry(0.35, 0.4, 0.3, 16, 1, true, 0, Math.PI);
            const collarMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.7,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const collar = new THREE.Mesh(collarGeometry, collarMaterial);
            collar.rotation.x = Math.PI / 2;
            collar.position.set(0, 1.25, 0.1);
            tshirtGroup.add(collar);

            tshirt = tshirtGroup;
            scene.add(tshirt);

            window.tshirtMaterials = [bodyMaterial, sleeveMaterial, collarMaterial];
        }

        function applyDesignToShirt(imageUrl) {
            if (currentDesignMesh) {
                tshirt.remove(currentDesignMesh);
            }

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(imageUrl, (texture) => {
                designTexture = texture;
                
                const scale = parseFloat(document.getElementById('design-scale').value);
                const position = parseFloat(document.getElementById('design-position').value);
                
                const aspectRatio = texture.image.width / texture.image.height;
                const designWidth = 1.2 * scale;
                const designHeight = designWidth / aspectRatio;

                const designGeometry = new THREE.PlaneGeometry(designWidth, designHeight);
                const designMaterial = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                currentDesignMesh = new THREE.Mesh(designGeometry, designMaterial);
                currentDesignMesh.position.set(0, position, 0.16);
                
                tshirt.add(currentDesignMesh);
            });
        }

        document.getElementById('texture-upload').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imageUrl = e.target.result;
                    document.getElementById('preview-image').src = imageUrl;
                    document.getElementById('preview-image').style.display = 'block';
                    applyDesignToShirt(imageUrl);
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('shirt-color').addEventListener('input', (event) => {
            const color = event.target.value;
            window.tshirtMaterials.forEach(material => {
                material.color.set(color);
            });
        });

        document.getElementById('design-scale').addEventListener('input', (event) => {
            const scale = parseFloat(event.target.value);
            document.getElementById('scale-value').textContent = scale.toFixed(1);
            
            if (currentDesignMesh && designTexture) {
                const aspectRatio = designTexture.image.width / designTexture.image.height;
                const designWidth = 1.2 * scale;
                const designHeight = designWidth / aspectRatio;
                
                currentDesignMesh.geometry.dispose();
                currentDesignMesh.geometry = new THREE.PlaneGeometry(designWidth, designHeight);
            }
        });

        document.getElementById('design-position').addEventListener('input', (event) => {
            const position = parseFloat(event.target.value);
            document.getElementById('position-value').textContent = position.toFixed(2);
            
            if (currentDesignMesh) {
                currentDesignMesh.position.y = position;
            }
        });

        window.resetDesign = function() {
            if (currentDesignMesh) {
                tshirt.remove(currentDesignMesh);
                currentDesignMesh = null;
            }
            document.getElementById('preview-image').style.display = 'none';
            document.getElementById('texture-upload').value = '';
            document.getElementById('shirt-color').value = '#ffffff';
            document.getElementById('design-scale').value = '1';
            document.getElementById('design-position').value = '0';
            document.getElementById('scale-value').textContent = '1.0';
            document.getElementById('position-value').textContent = '0';
            
            window.tshirtMaterials.forEach(material => {
                material.color.set(0xffffff);
            });
        };

        window.downloadScreenshot = function() {
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'tshirt-design.png';
            link.href = dataURL;
            link.click();
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
